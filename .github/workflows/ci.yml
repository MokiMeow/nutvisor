name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

# Only the latest commit on each branch or pull request needs a full run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc make nasm

      - name: Build VMM and guests with warnings as errors
        run: make clean && make all CFLAGS='-std=gnu11 -Wall -Wextra -Werror -Iinclude -O2'

      - name: Run hardware-free regression tests
        run: make test-host

      - name: Run AddressSanitizer and UndefinedBehaviorSanitizer
        run: make sanitize

      # GitHub's Ubuntu runners do ship /dev/kvm, but it is root-only by
      # default, so simply testing that the file exists is not enough — the
      # runner has to be able to open it. This is the documented workaround.
      - name: Grant access to /dev/kvm
        continue-on-error: true
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || true

      - name: Run the KVM self-test (skip only if KVM is unusable)
        run: |
          # -r and -w, not -e: the device existing says nothing about whether
          # this user can open it, which is exactly how this step failed before.
          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            echo "/dev/kvm is usable — running the complete guest suite."
            SELFTEST_TIMEOUT=120 make test
          else
            echo "SKIP: /dev/kvm is present but not usable by this runner."
            echo "Host regression/sanitizer tests passed; guest execution was NOT verified."
            echo "Run make test on a KVM host (see docs/01-getting-started.md)."
          fi
